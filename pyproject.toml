[project]
name = "critical_dir"
version = "0.1.0"
license = " AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pytest",
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "k-means-constrained",
    "geopandas",
    "uvicorn",
    "fastapi",
    "requests",
    "psycopg[binary,pool]",
    "redis",
    "pydantic-settings",
    "jinja2",
    "pre-commit",
    # the 'ruff' version specified here must match the version in .pre-commit-config.yaml
    "ruff==0.16.8"
]

[project.scripts]
critical-dir-api = "critical_dir.api:main"
critical-dir-apiimport = "critical_dir.cmaps_api_import:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Note: conftest.py file excludes certain subdirs -- unless enabled by command line option
testpaths = ["tests"]


[tool.ruff]
# Ignore file containing code removed from other file
# -> requires additional work before it can be used
extend-exclude = ["src/critical_dir/criticaldir_core_plotter.py"]
[tool.ruff.lint]
ignore = ["I001","PLR2044"] # I001: Import block is un-sorted or un-formatted; PLR2044: Line with empty comment
